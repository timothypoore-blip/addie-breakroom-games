# Supabase CLI config — Break Room Games leaderboard
# Run `supabase link --project-ref sxpyphlqnpjncxtckivm` from this folder
# to bind the CLI to the hosted project.

project_id = "sxpyphlqnpjncxtckivm"

# Edge Functions
# We manage auth ourselves via player_token, so neither function should
# require a Supabase Auth JWT. The functions still need the publishable
# `apikey` header to reach PostgREST/Functions infrastructure.

[functions.register-player]
verify_jwt = false

[functions.submit-score]
verify_jwt = false
