<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Chartle — Addie Break Room</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{
    --navy:#081829;
    --blue:#185793;
    --green:#8BC53F;
    --green-dark:#6fa030;
    --white:#ffffff;
    --gray-50:#f8fafc;
    --gray-100:#f1f5f9;
    --gray-200:#e2e8f0;
    --gray-400:#94a3b8;
    --gray-600:#475569;

    --correct:#8BC53F;   /* right letter, right place */
    --present:#F0B429;   /* right letter, wrong place */
    --absent:#94a3b8;    /* not in the word */
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;
    background:#fff;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:20px 12px 32px;
    overflow-x:hidden;
    position:relative;
  }
  #bgCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .game-wrap{position:relative;z-index:1;width:100%;max-width:520px;}

  /* ── HEADER ── */
  .game-header{text-align:center;margin-bottom:16px;}
  .game-logo{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(255,255,255,0.9);
    border:1px solid var(--gray-200);
    border-radius:100px;padding:6px 18px 6px 10px;margin-bottom:12px;
    box-shadow:0 2px 12px rgba(8,24,41,0.08);
  }
  .game-logo-mark{
    width:30px;height:30px;
    background:linear-gradient(135deg,var(--blue),var(--green));
    border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:14px;
  }
  .game-logo-text{font-size:0.82rem;font-weight:700;color:var(--navy);}
  .game-logo-text span{color:var(--green-dark);}
  .game-title{
    font-size:clamp(1.6rem,5vw,2.2rem);font-weight:900;
    color:var(--navy);line-height:1.1;letter-spacing:-0.02em;
  }
  .game-sub{font-size:0.85rem;color:var(--gray-600);font-weight:500;margin-top:6px;}
  .puzzle-meta{
    display:inline-block;margin-top:9px;font-size:0.68rem;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--gray-400);
  }

  /* ── GRID ── */
  .grid{
    display:grid;grid-template-rows:repeat(6,1fr);gap:6px;
    max-width:360px;margin:0 auto 18px;
  }
  .row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .cell{
    aspect-ratio:1;
    border:2px solid var(--gray-200);
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:clamp(1rem,4.5vw,1.5rem);
    color:var(--navy);
    text-transform:uppercase;
    background:#fff;
    user-select:none;
    transition:border-color .12s,transform .08s;
  }
  .cell.filled{border-color:var(--gray-400);animation:pop .1s ease;}
  @keyframes pop{50%{transform:scale(1.07);}}
  .cell.reveal{animation:flip .5s ease forwards;}
  @keyframes flip{
    0%{transform:rotateX(0);}
    50%{transform:rotateX(90deg);}
    100%{transform:rotateX(0);}
  }
  .cell.correct{background:var(--correct);border-color:var(--correct);color:#fff;}
  .cell.present{background:var(--present);border-color:var(--present);color:#fff;}
  .cell.absent {background:var(--absent);border-color:var(--absent);color:#fff;}
  .row.shake{animation:shake .5s ease;}
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-7px);}
    40%{transform:translateX(7px);}
    60%{transform:translateX(-5px);}
    80%{transform:translateX(5px);}
  }

  /* ── KEYBOARD ── */
  .kb{display:flex;flex-direction:column;gap:6px;max-width:500px;margin:0 auto;}
  .kb-row{display:flex;gap:5px;justify-content:center;}
  .key{
    flex:1;
    min-width:0;
    height:50px;
    border:none;
    border-radius:7px;
    background:var(--gray-100);
    color:var(--navy);
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:0.82rem;
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,color .15s,transform .06s;
  }
  .key:active{transform:scale(0.94);}
  .key.wide{flex:1.6;font-size:0.68rem;letter-spacing:.04em;}
  .key.correct{background:var(--correct);color:#fff;}
  .key.present{background:var(--present);color:#fff;}
  .key.absent {background:var(--absent);color:#fff;opacity:.65;}

  /* ── TOAST ── */
  .toast{
    position:fixed;left:50%;top:22px;transform:translate(-50%,-20px);
    background:var(--navy);color:#fff;padding:10px 22px;border-radius:100px;
    font-size:0.82rem;font-weight:700;box-shadow:0 6px 22px rgba(8,24,41,.28);
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    z-index:50;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* ── RESULTS ── */
  .results{
    margin-top:16px;
    background:rgba(255,255,255,0.95);
    border:1px solid var(--gray-200);
    border-radius:20px;padding:22px 20px;text-align:center;
    box-shadow:0 4px 24px rgba(8,24,41,0.09);
    animation:rpop .4s cubic-bezier(.34,1.4,.64,1) both;
  }
  @keyframes rpop{from{transform:scale(.93);opacity:0;}to{transform:scale(1);opacity:1;}}
  .results-emoji{font-size:2.3rem;line-height:1;}
  .results-title{font-size:1.2rem;font-weight:900;color:var(--navy);margin-top:8px;letter-spacing:-0.02em;}
  .word-reveal{
    margin:16px 0 4px;padding:14px 16px;
    background:var(--navy);border-radius:14px;color:#fff;
  }
  .word-reveal .w{
    font-size:1.4rem;font-weight:900;letter-spacing:.14em;
  }
  .word-reveal .g{
    font-size:0.82rem;font-weight:400;opacity:.92;margin-top:7px;line-height:1.45;
  }
  .results-stats{display:flex;justify-content:center;gap:26px;margin:16px 0 4px;}
  .rstat-label{font-size:0.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-400);}
  .rstat-value{font-size:1.5rem;font-weight:900;color:var(--navy);line-height:1.1;}
  .share-grid{font-size:1rem;line-height:1.3;letter-spacing:2px;margin:12px 0 4px;}
  .results-note{font-size:0.72rem;color:var(--gray-400);margin-top:12px;line-height:1.5;}

  .how{margin-top:14px;text-align:center;font-size:0.74rem;color:var(--gray-600);line-height:1.55;}
  .how b{color:var(--navy);}

  @media(max-width:420px){
    .key{height:44px;font-size:0.75rem;}
    .grid{max-width:300px;}
  }
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="game-wrap">
  <div class="game-header">
    <div class="game-logo">
      <div class="game-logo-mark">A</div>
      <div class="game-logo-text">Addie <span>Break Room</span></div>
    </div>
    <h1 class="game-title">Chartle</h1>
    <div class="game-sub">Six letters, six guesses. Today's word is one you already know.</div>
    <div class="puzzle-meta" id="puzzleMeta"></div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="kb" id="kb"></div>

  <div class="how" id="howBox">
    <b>Green</b> = right letter, right spot. <b>Amber</b> = right letter, wrong spot.
    Every answer comes from case management, discharge planning, or the payer side.
    New word daily at midnight Eastern.
  </div>

  <div id="resultsSlot"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════
   PEP FLOW FIELD BG
══════════════════════ */
(function(){
  var c=document.getElementById('bgCanvas');
  var ctx=c.getContext('2d');
  var W,H,pts=[],mouse={x:-1e4,y:-1e4};
  var PAL=[[139,197,63],[24,87,147],[13,74,138],[111,160,48],[58,127,193],[93,168,50]];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;}
  function mkPt(){
    var col=PAL[Math.floor(Math.random()*PAL.length)];
    return{x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,
      r:col[0],g:col[1],b:col[2],age:0,life:Math.random()*200+100};
  }
  resize();
  for(var i=0;i<500;i++)pts.push(mkPt());
  window.addEventListener('resize',resize);
  window.addEventListener('mousemove',function(e){mouse.x=e.clientX;mouse.y=e.clientY;});
  window.addEventListener('mouseleave',function(){mouse.x=-1e4;mouse.y=-1e4;});
  var t=0;
  function loop(){
    requestAnimationFrame(loop);
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(0,0,W,H);
    t+=0.003;
    for(var i=0;i<pts.length;i++){
      var p=pts[i];
      var angle=(Math.cos(p.x*0.005)+Math.sin(p.y*0.005))*Math.PI+t;
      p.vx+=Math.cos(angle)*0.22;p.vy+=Math.sin(angle)*0.22;
      var dx=mouse.x-p.x,dy=mouse.y-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<150){var f=(150-d)/150;p.vx-=dx*f*0.05;p.vy-=dy*f*0.05;}
      p.vx*=0.95;p.vy*=0.95;
      p.x+=p.vx;p.y+=p.vy;
      p.age++;
      if(p.age>p.life){pts[i]=mkPt();continue;}
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;
      if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      var alpha=(1-Math.abs(p.age/p.life-0.5)*2)*0.55;
      ctx.globalAlpha=alpha;
      ctx.fillStyle='rgb('+p.r+','+p.g+','+p.b+')';
      ctx.fillRect(p.x,p.y,1.5,1.5);
    }
    ctx.globalAlpha=1;
  }
  loop();
})();


/* ══════════════════════════════════════════════════════════════════
   ANSWER BANK — the daily words, each with its reveal gloss.
   Answers must be six letters and must also appear in GUESS_BLOB.
   Adding one is a single line; the daily rotation length follows
   the array automatically.
══════════════════════════════════════════════════════════════════ */
var ANSWERS = [

];

══════════════════════════════════════════════════════════════════ */

(function(){
  'use strict';

  var GAME_ID  = 'chartle';
  var WORD_LEN = 6;
  var MAX_ROWS = 6;
  var STORE_PREFIX = 'addie_chartle_';

  /* Rebuild the guess set from the blob. */
  var VALID = new Set();
  for(var bi = 0; bi < GUESS_BLOB.length; bi += WORD_LEN){
    VALID.add(GUESS_BLOB.substr(bi, WORD_LEN));
  }
  ANSWERS.forEach(function(a){ VALID.add(a[0]); });

  /* ── Daily word (Eastern time), same scheme as Discharge Connections ── */
  function etDateKey(){
    try{
      return new Date().toLocaleDateString('en-CA',{timeZone:'America/New_York'});
    }catch(e){
      var d=new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
  }
  function dayNumber(key){
    var p=key.split('-');
    return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000);
  }

  var DATE_KEY = etDateKey();
  var DAY_NUM  = dayNumber(DATE_KEY);
  var A_INDEX  = ((DAY_NUM % ANSWERS.length) + ANSWERS.length) % ANSWERS.length;
  var ANSWER   = ANSWERS[A_INDEX][0];
  var GLOSS    = ANSWERS[A_INDEX][1];

  var state = {
    row: 0,
    cur: '',
    rows: [],          /* array of {word, marks} */
    over: false,
    won: false,
    startedAt: Date.now(),
    posted: false,
    keyState: {}
  };

  var elGrid = document.getElementById('grid');
  var elKb   = document.getElementById('kb');
  var elToast= document.getElementById('toast');
  var elMeta = document.getElementById('puzzleMeta');
  var elRes  = document.getElementById('resultsSlot');
  var elHow  = document.getElementById('howBox');

  elMeta.textContent = 'Word #' + (A_INDEX + 1) + ' · ' + prettyDate(DATE_KEY);

  function prettyDate(key){
    var p=key.split('-');
    var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
    var M=['January','February','March','April','May','June','July',
           'August','September','October','November','December'];
    return M[d.getUTCMonth()]+' '+d.getUTCDate()+', '+d.getUTCFullYear();
  }

  function toast(msg, ms){
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ elToast.classList.remove('show'); }, ms || 1500);
  }

  /* ── Wordle letter scoring, duplicate-safe two-pass ─────────────
     Pass one locks exact positions and tallies the answer's leftover
     letters. Pass two hands out ambers only while that tally lasts,
     so guessing ROUNDS against ORDERS can't paint two R's amber when
     the answer holds one. ──────────────────────────────────────── */
  function scoreGuess(guess, answer){
    var marks = new Array(WORD_LEN).fill('absent');
    var left = {};
    var i, c;
    for(i = 0; i < WORD_LEN; i++){
      if(guess[i] === answer[i]){
        marks[i] = 'correct';
      }else{
        c = answer[i];
        left[c] = (left[c] || 0) + 1;
      }
    }
    for(i = 0; i < WORD_LEN; i++){
      if(marks[i] === 'correct') continue;
      c = guess[i];
      if(left[c] > 0){ marks[i] = 'present'; left[c]--; }
    }
    return marks;
  }

  /* ── RENDER ── */
  function buildGrid(){
    elGrid.innerHTML = '';
    for(var r = 0; r < MAX_ROWS; r++){
      var row = document.createElement('div');
      row.className = 'row';
      row.dataset.r = r;
      for(var c = 0; c < WORD_LEN; c++){
        var cell = document.createElement('div');
        cell.className = 'cell';
        row.appendChild(cell);
      }
      elGrid.appendChild(row);
    }
  }

  function paintCurrent(){
    var row = elGrid.children[state.row];
    if(!row) return;
    for(var c = 0; c < WORD_LEN; c++){
      var cell = row.children[c];
      var ch = state.cur[c] || '';
      cell.textContent = ch;
      cell.classList.toggle('filled', !!ch);
    }
  }

  function paintRow(r, word, marks, animate){
    var row = elGrid.children[r];
    for(var c = 0; c < WORD_LEN; c++){
      (function(c){
        var cell = row.children[c];
        cell.textContent = word[c];
        var apply = function(){
          cell.classList.remove('filled');
          cell.classList.add(marks[c]);
        };
        if(animate){
          setTimeout(function(){
            cell.classList.add('reveal');
            setTimeout(apply, 240);
          }, c * 130);
        }else{
          apply();
        }
      })(c);
    }
  }

  var KB_ROWS = ['QWERTYUIOP','ASDFGHJKL','↵ZXCVBNM⌫'];
  function buildKeyboard(){
    elKb.innerHTML = '';
    KB_ROWS.forEach(function(rowStr){
      var row = document.createElement('div');
      row.className = 'kb-row';
      rowStr.split('').forEach(function(ch){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'key';
        if(ch === '↵'){ btn.textContent = 'ENTER'; btn.classList.add('wide'); btn.dataset.k = 'ENTER'; }
        else if(ch === '⌫'){ btn.textContent = 'DEL'; btn.classList.add('wide'); btn.dataset.k = 'BACK'; }
        else { btn.textContent = ch; btn.dataset.k = ch; }
        btn.addEventListener('click', function(){ handleKey(btn.dataset.k); });
        row.appendChild(btn);
      });
      elKb.appendChild(row);
    });
    paintKeyboard();
  }

  var RANK = {absent:1, present:2, correct:3};
  function paintKeyboard(){
    Array.prototype.forEach.call(elKb.querySelectorAll('.key'), function(btn){
      var k = btn.dataset.k;
      btn.classList.remove('correct','present','absent');
      if(state.keyState[k]) btn.classList.add(state.keyState[k]);
    });
  }

  /* ── INPUT ── */
  function handleKey(k){
    if(state.over) return;
    if(k === 'ENTER'){ submitGuess(); return; }
    if(k === 'BACK'){ state.cur = state.cur.slice(0, -1); paintCurrent(); return; }
    if(/^[A-Z]$/.test(k) && state.cur.length < WORD_LEN){
      state.cur += k;
      paintCurrent();
    }
  }

  document.addEventListener('keydown', function(e){
    if(state.over) return;
    if(e.key === 'Enter'){ e.preventDefault(); handleKey('ENTER'); }
    else if(e.key === 'Backspace'){ e.preventDefault(); handleKey('BACK'); }
    else if(/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
  });

  function submitGuess(){
    if(state.cur.length < WORD_LEN){
      toast('Needs six letters');
      shakeRow();
      return;
    }
    if(!VALID.has(state.cur)){
      toast('Not in the word list');
      shakeRow();
      return;
    }

    var word  = state.cur;
    var marks = scoreGuess(word, ANSWER);
    state.rows.push({word: word, marks: marks});
    paintRow(state.row, word, marks, true);

    /* Keyboard keeps the best result seen for each letter. */
    for(var i = 0; i < WORD_LEN; i++){
      var c = word[i], m = marks[i];
      if(!state.keyState[c] || RANK[m] > RANK[state.keyState[c]]) state.keyState[c] = m;
    }

    state.row++;
    state.cur = '';

    var revealDone = (WORD_LEN - 1) * 130 + 300;
    setTimeout(function(){
      paintKeyboard();
      if(word === ANSWER){ finish(true); }
      else if(state.row >= MAX_ROWS){ finish(false); }
    }, revealDone);
  }

  function shakeRow(){
    var row = elGrid.children[state.row];
    if(!row) return;
    row.classList.remove('shake');
    void row.offsetWidth;
    row.classList.add('shake');
  }

  /* ── END ── */
  function finish(won){
    state.over = true;
    state.won  = won;
    var seconds = Math.round((Date.now() - state.startedAt) / 1000);

    try{
      sessionStorage.setItem('addie_chartle_last', JSON.stringify({
        date: DATE_KEY, won: won, guesses: state.rows.length, seconds: seconds
      }));
    }catch(e){}

    saveState(seconds);

    /* ── LEADERBOARD ────────────────────────────────────────────
       Score is guesses used, lower_is_better. Only a solve posts —
       a failed board would always score 6 and tell the hub nothing,
       same rule as Discharge Connections. ────────────────────── */
    if(won && !state.posted && window.BreakroomLeaderboard){
      state.posted = true;
      window.BreakroomLeaderboard.submit({
        gameId: GAME_ID,
        score:  state.rows.length,
        meta:   {
          puzzle_date:   DATE_KEY,
          puzzle_index:  A_INDEX,
          answer:        ANSWER,
          guesses_used:  state.rows.length,
          solve_seconds: seconds
        }
      }).catch(function(e){ console.warn('Leaderboard submit failed:', e); });
    }

    showResults(won, seconds);
  }

  function showResults(won, seconds){
    elHow.style.display = 'none';
    elKb.style.display  = 'none';

    var n = state.rows.length;
    var emoji, title;
    if(won && n === 1){ emoji='🔮'; title='On the first guess'; }
    else if(won && n === 2){ emoji='🏆'; title='Two guesses'; }
    else if(won && n === 3){ emoji='⭐'; title='Solid'; }
    else if(won && n === 4){ emoji='🎯'; title='Got it'; }
    else if(won && n === 5){ emoji='😮‍💨'; title='Down to the wire'; }
    else if(won){ emoji='😅'; title='Last guess'; }
    else { emoji='📋'; title='Not today'; }

    var share = state.rows.map(function(r){
      return r.marks.map(function(m){
        return m === 'correct' ? '🟩' : (m === 'present' ? '🟨' : '⬜');
      }).join('');
    }).join('<br>');

    var mm = Math.floor(seconds / 60), ss = seconds % 60;
    var timeStr = mm + ':' + String(ss).padStart(2, '0');

    var stats = won
      ? '<div><div class="rstat-label">Guesses</div><div class="rstat-value">' + n + '</div></div>' +
        '<div><div class="rstat-label">Time</div><div class="rstat-value">' + timeStr + '</div></div>'
      : '<div><div class="rstat-label">Guesses</div><div class="rstat-value">' + n + '</div></div>';

    var note = won
      ? 'Your score posts to this week&rsquo;s Break Room leaderboard. Fewer guesses ranks higher.'
      : 'Only solved words post to the leaderboard. New word at midnight Eastern.';

    elRes.innerHTML =
      '<div class="results">' +
        '<div class="results-emoji">' + emoji + '</div>' +
        '<div class="results-title">' + title + '</div>' +
        '<div class="word-reveal">' +
          '<div class="w">' + esc(ANSWER) + '</div>' +
          '<div class="g">' + esc(GLOSS) + '</div>' +
        '</div>' +
        '<div class="results-stats">' + stats + '</div>' +
        '<div class="share-grid">' + share + '</div>' +
        '<div class="results-note">' + note + '</div>' +
      '</div>';
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  /* ── PERSISTENCE: one word per day ── */
  function storeKey(){ return STORE_PREFIX + DATE_KEY; }

  function saveState(seconds){
    try{
      localStorage.setItem(storeKey(), JSON.stringify({
        v: 1, won: state.won, seconds: seconds,
        rows: state.rows.map(function(r){ return r.word; })
      }));
    }catch(e){}
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(storeKey());
      if(!raw) return null;
      var d = JSON.parse(raw);
      return (d && d.v === 1) ? d : null;
    }catch(e){ return null; }
  }

  (function pruneOldDays(){
    try{
      var kill = [];
      for(var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if(k && k.indexOf(STORE_PREFIX) === 0 && k !== storeKey()) kill.push(k);
      }
      kill.forEach(function(k){ localStorage.removeItem(k); });
    }catch(e){}
  })();

  /* ── BOOT ── */
  buildGrid();
  buildKeyboard();

  var prior = loadState();
  if(prior){
    /* Replay today's finished board; never post a second score. */
    prior.rows.forEach(function(w, r){
      var marks = scoreGuess(w, ANSWER);
      state.rows.push({word: w, marks: marks});
      paintRow(r, w, marks, false);
      for(var i = 0; i < WORD_LEN; i++){
        var c = w[i], m = marks[i];
        if(!state.keyState[c] || RANK[m] > RANK[state.keyState[c]]) state.keyState[c] = m;
      }
    });
    state.row    = prior.rows.length;
    state.over   = true;
    state.won    = prior.won;
    state.posted = true;
    paintKeyboard();
    showResults(prior.won, prior.seconds || 0);
    var already = document.createElement('div');
    already.className = 'results-note';
    already.style.textAlign = 'center';
    already.style.marginTop = '12px';
    already.textContent = 'You already played today’s word. A new one lands at midnight Eastern.';
    elRes.appendChild(already);
  }

})();
</script>
